<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0f14"/>
  <title>AccessBell — Door alerts</title>
  <link rel="manifest" href="/assets/manifest.json"/>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/assets/style.css"/>
</head>
<body>
  <header class="topbar">
    <h1 class="brand" id="brand">AccessBell</h1>
    <div class="controls">
      <span id="status" class="status status-connecting" aria-live="polite"></span>
      <button id="lang-toggle" class="chip" type="button"></button>
      <button id="bilingual-toggle" class="chip" type="button" aria-pressed="false"></button>
      <button id="voice-toggle" class="chip" type="button" aria-pressed="false"></button>
      <button id="child-toggle" class="chip" type="button" aria-pressed="false"></button>
    </div>
  </header>

  <p id="sr-live" class="sr-only" aria-live="assertive"></p>
  <p id="api-auth-note" class="note warn banner hidden" role="status"></p>

  <main>
    <section id="alert" class="alert hidden">
      <div class="alert-head">
        <span class="clock" id="clock" aria-hidden="true"></span>
        <span id="latency" class="badge badge-latency"></span>
      </div>
      <div id="caption" class="caption"></div>
      <div id="caption-sub" class="caption-sub"></div>
      <p id="visitor-said" class="why hidden"></p>
      <p id="why" class="why"></p>
      <p id="tier2-note" class="note warn hidden"></p>
      <div class="meta">
        <span id="category" class="badge"></span>
        <span id="urgency" class="badge"></span>
        <span id="confidence" class="badge"></span>
        <span id="grounding" class="badge"></span>
        <span id="context" class="badge"></span>
      </div>
      <div id="evidence" class="evidence"></div>
      <div id="verification" class="meta hidden">
        <span id="verification-badge" class="badge"></span>
        <span id="risk-badge" class="badge"></span>
      </div>
      <p id="challenge" class="why hidden"></p>
      <div id="memory" class="hidden">
        <span id="memory-text"></span>
        <button id="memory-use" class="reply" type="button"></button>
      </div>
      <div id="escalation" class="escalation hidden">
        <span id="escalation-text"></span>
        <button id="stop-escalation" class="danger" type="button"></button>
      </div>
      <div id="replies" class="replies"></div>
      <p id="note" class="note" aria-live="polite"></p>
      <p id="tv-note" class="note tv-note"></p>
    </section>

    <section id="ring-sim" class="panel simulator hidden">
      <h2 id="h-ring"></h2>
      <p id="ring-note" class="note"></p>
      <div class="grid">
        <label id="l-ring-scenario" for="ring-scenario"></label>
        <select id="ring-scenario"></select>
        <label id="l-ring-statement" for="ring-statement"></label>
        <input id="ring-statement"/>
      </div>
      <div class="replies">
        <button id="ring-fire" class="reply primary" type="button"></button>
        <button id="ring-motion" class="reply" type="button"></button>
      </div>
      <p id="ring-result" class="note" aria-live="polite"></p>
    </section>

    <section id="alexa-demo" class="panel simulator hidden">
      <h2 id="h-alexa"></h2>
      <p id="alexa-note" class="note"></p>
      <p id="alexa-utterance" class="alexa-utterance"></p>
      <div class="replies">
        <button id="alexa-ask" class="primary" type="button"></button>
        <button id="alexa-reply" class="reply" type="button" disabled></button>
      </div>
      <ol id="alexa-transcript" class="alexa-transcript" aria-live="polite"></ol>
      <p id="alexa-answer" class="alexa-answer" aria-live="polite"></p>
    </section>

    <section class="panel" id="advise-panel">
      <h2 id="h-advise"></h2>
      <ul id="advise" class="list"></ul>
    </section>

    <section class="panel">
      <h2 id="h-history"></h2>
      <ul id="history" class="history"></ul>
      <button id="export-log" class="primary" type="button"></button>
    </section>

    <section class="panel">
      <h2 id="h-calendar"></h2>
      <form id="calendar-form" class="grid">
        <label id="l-window-label" for="w-label"></label>
        <input id="w-label" required/>
        <label id="l-window-start" for="w-start"></label>
        <input id="w-start" placeholder="2026-09-15T15:00:00Z" required/>
        <label id="l-window-end" for="w-end"></label>
        <input id="w-end" placeholder="2026-09-15T16:30:00Z" required/>
        <button id="add-window" class="primary" type="submit"></button>
      </form>
      <ul id="windows" class="list"></ul>
    </section>

    <section class="panel" id="talk-panel">
      <h2 id="h-talk"></h2>
      <div class="grid">
        <label id="l-talk-speaker" for="talk-speaker"></label>
        <select id="talk-speaker">
          <option value="visitor" id="opt-visitor"></option>
          <option value="resident" id="opt-resident"></option>
        </select>
        <label id="l-talk-lang" for="talk-lang"></label>
        <select id="talk-lang">
          <option value="en">EN</option>
          <option value="vi">VI</option>
        </select>
        <label id="l-talk-text" for="talk-text"></label>
        <input id="talk-text" />
      </div>
      <div class="replies">
        <button id="talk-mic" type="button"></button>
        <button id="talk-translate" type="button"></button>
        <button id="talk-speak" type="button"></button>
        <button id="talk-send" class="primary" type="button"></button>
      </div>
      <p id="talk-translation" class="note" aria-live="polite"></p>
      <ul id="talk-turns" class="list"></ul>
    </section>

    <section class="panel">
      <h2 id="h-share"></h2>
      <label id="l-recipient" for="recipient"></label>
      <input id="recipient" placeholder="nurse@example.com"/>
      <div class="replies">
        <button id="preview" type="button"></button>
        <button id="share" class="primary" type="button" disabled></button>
      </div>
      <pre id="share-preview" class="preview"></pre>
      <label class="check"><input type="checkbox" id="consent"/> <span id="l-consent"></span></label>
      <ul id="shares" class="list"></ul>
    </section>

    <section id="demo" class="demo hidden">
      <h2 id="h-demo"></h2>
      <div id="demo-buttons" class="replies"></div>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
